name: Reference snapshots
# Regenerates refs/node-<major>.json (design 1.6: Node-only reference
# snapshots — browser references are deliberately NOT published, because a
# stale browser reference produces false drift reports).
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 1 * *' # monthly; Node LTS lines move slowly

jobs:
  # Same self-updating major list as CI: new Node LTS lines join on their own.
  versions:
    runs-on: ubuntu-latest
    outputs:
      majors: ${{ steps.list.outputs.majors }}
    steps:
      - id: list
        run: |
          MAJORS=$(curl -fsSL https://nodejs.org/dist/index.json \
            | jq -c '[.[].version[1:] | split(".")[0] | tonumber]
                     | unique | map(select(. >= 18 and . % 2 == 0)) | sort')
          echo "majors=$MAJORS" >> "$GITHUB_OUTPUT"

  snapshot:
    needs: versions
    strategy:
      matrix:
        node: ${{ fromJSON(needs.versions.outputs.majors) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: node intl-drift.cjs probe --out refs/node-${{ matrix.node }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.node }}-snapshot
          path: refs/node-${{ matrix.node }}.json

  # Snapshots are byte-deterministic, so a no-change month produces an empty
  # diff and no PR. A changed snapshot means the Node distro itself moved
  # ICU/CLDR inside a release line — exactly the event worth a commit. The
  # PR is deliberately NOT auto-merged: it doubles as the notification.
  propose:
    needs: snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: refs/
      - uses: peter-evans/create-pull-request@v6
        with:
          title: 'refs: regenerate Node reference snapshots'
          commit-message: 'refs: regenerate Node reference snapshots'
          branch: refs/regenerate
          body: >-
            Automated regeneration. A non-empty diff here means a Node release
            line changed its ICU/CLDR data — review the drift before merging
            (tip: run `node intl-drift.cjs diff` on the old vs new file).

  # GitHub disables cron workflows after ~60 days without repo activity;
  # quiet months here are by design, so keep the schedules alive via API
  # (no dummy commits).
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: gautamkrishnar/keepalive-workflow@v2
        with:
          use_api: true
