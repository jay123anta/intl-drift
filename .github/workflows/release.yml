name: Release
# Push a version tag and this publishes to npm + creates the GitHub Release:
#   git tag v0.2.0 && git push origin v0.2.0
# One-time setup: create an npm Granular Access Token (packages: read/write,
# scoped to intl-drift) and store it as the repo secret NPM_TOKEN.
on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write # create the GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Never publish untested code: full gate first.
      - run: node probe.cjs --selftest
      - run: node test.cjs

      # The tag must match package.json — a mismatched tag aborts the release.
      - run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
