name: Release
# Push a version tag and this publishes to npm + creates the GitHub Release:
#   git tag v0.2.0 && git push origin v0.2.0
# Publishing uses npm Trusted Publishing (OIDC): no token, no secret, no
# expiry, and the account's strict 2FA stays untouched. One-time setup on
# npmjs.com: package intl-drift -> Settings -> Trusted Publisher -> GitHub
# Actions -> owner jay123anta, repo intl-drift, workflow release.yml.
on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: write # create the GitHub Release
  id-token: write # OIDC for npm Trusted Publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Never publish untested code: full gate first.
      - run: node probe.cjs --selftest
      - run: node test.cjs

      # The tag must match package.json — a mismatched tag aborts the release.
      - run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      # OIDC publishing needs a current npm CLI (runner's default may lag).
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
